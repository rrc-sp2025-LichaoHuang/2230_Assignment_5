<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 5</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <div id="title">
        <h1>Walkways Viewer</h1>
        <p>Browse the longest, shortest, or randomly selected Winnipeg walkways.</p>
    </div>

    <div id="selectBox">
        <fieldset id="searchMethod">
            <legend>Search Method</legend>
            <label for="Method">Select a method:</label>
            <select name="searchMethod" id="Method">
                <option value=""></option>
                <option value="long">Longest</option>
                <option value="short">Shortest</option>
                <option value="random">Random</option>
            </select>
            <span id="methodError" class="inputError"></span>
        </fieldset>

        <fieldset id="amount">
            <legend>Amount</legend>
            <label for="amountInput">Enter amount (1–10):</label>
            <input type="number" id="amountInput" max="10" min="1">
            <span id="numberError" class="inputError"></span>
        </fieldset>

        <button id="search">Search</button>
    </div>

    <div id="showcase"></div>

    <script src="script.js"></script>
</body>
</html>
